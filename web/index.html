<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14301f">
<title>AgroFerre POS - Insumos Agricolas y Ferreteria</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-logo">🌾🔧</div>
    <p>Cargando AgroFerre...</p>
  </div>

  <div id="app" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-mark">🌾</span>
        <span class="brand-text">
          <strong id="brand-name">AgroFerre</strong>
          <small>Insumos y Ferreteria</small>
        </span>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <span class="avatar" id="user-avatar">A</span>
          <span class="user-meta">
            <strong id="user-name">Usuario</strong>
            <small id="user-role">rol</small>
          </span>
        </div>
        <button class="btn btn-ghost btn-block" data-action="logout">Cerrar sesion</button>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" data-action="toggle-menu" aria-label="Menu">☰</button>
        <div class="topbar-title">
          <h1 id="view-title">Inicio</h1>
          <p id="view-sub"></p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <main id="view" class="view"></main>
    </div>

    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <iframe id="print-frame" title="impresion" style="position:fixed;width:0;height:0;border:0;left:-9999px"></iframe>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
